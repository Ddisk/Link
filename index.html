<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111318" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <title>リンク一覧</title>
  <style>
    :root { --bg:#0f1115; --card:#171a21; --card-hover:#1f2430; --text:#f5f7fa; --sub:#aeb6c2; --line:#2a303b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:radial-gradient(circle at top, rgba(255,213,74,.08), transparent 32rem),var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"Noto Sans JP",sans-serif; }
    a { color:inherit; text-decoration:none; }
    .wrap { width:min(680px,calc(100% - 28px)); margin:0 auto; padding:48px 0 64px; }
    .profile { text-align:center; margin-bottom:30px; }
    .icon { width:92px; height:92px; margin:0 auto 18px; border-radius:50%; display:grid; place-items:center; font-size:38px; background:linear-gradient(145deg,#ffe66b,#ffbd2e); color:#1b1b1b; box-shadow:0 10px 30px rgba(0,0,0,.22); border:3px solid rgba(255,255,255,.16); }
    h1 { margin:0; font-size:clamp(26px,7vw,36px); letter-spacing:.04em; }
    .description { margin:10px auto 0; color:var(--sub); font-size:14px; line-height:1.8; }
    .section-title { margin:28px 4px 10px; font-size:13px; color:var(--sub); font-weight:700; letter-spacing:.08em; }
    .links { display:grid; gap:12px; }
    .link-card { display:flex; align-items:center; gap:14px; min-height:74px; padding:14px 16px; border-radius:18px; background:rgba(23,26,33,.94); border:1px solid var(--line); box-shadow:0 5px 18px rgba(0,0,0,.13); transition:transform .18s ease,background .18s ease,border-color .18s ease; }
    .link-card:hover { transform:translateY(-2px); background:var(--card-hover); border-color:rgba(255,213,74,.45); }
    .link-card:active { transform:scale(.985); }
    .link-icon { flex:0 0 auto; width:46px; height:46px; border-radius:14px; display:grid; place-items:center; background:rgba(255,213,74,.1); border:1px solid rgba(255,213,74,.18); font-size:22px; }
    .link-text { min-width:0; flex:1; }
    .link-name { display:block; font-size:16px; font-weight:750; line-height:1.35; }
    .link-note { display:block; margin-top:4px; color:var(--sub); font-size:12px; line-height:1.45; }
    .arrow { color:var(--sub); font-size:20px; }
    footer { margin-top:36px; text-align:center; color:#747e8c; font-size:11px; }
    @media (max-width:480px) { .wrap { width:min(100% - 20px,680px); padding-top:34px; } .link-card { min-height:70px; border-radius:16px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="profile">
      <div class="icon">🔗</div>
      <h1>リンク一覧</h1>
      <p class="description">作成したWebページをまとめています。</p>
    </header>

    <div class="section-title">MY TOOLS</div>
    <section class="links">
      <a class="link-card" href="https://ddisk.github.io/macro/" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">📊</div><div class="link-text"><span class="link-name">VBA・マクロ解説</span><span class="link-note">Excel VBA・マクロの仕組みをわかりやすく紹介</span></div><span class="arrow">›</span>
      </a>
      <a class="link-card" href="https://ddisk.github.io/tolerance/" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">📐</div><div class="link-text"><span class="link-name">公差・幾何公差</span><span class="link-note">寸法公差や幾何公差についてまとめたページ</span></div><span class="arrow">›</span>
      </a>
      <a class="link-card" href="https://ddisk.github.io/FFT/" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">〰️</div><div class="link-text"><span class="link-name">FFT・フーリエ変換</span><span class="link-note">FFTの計算や周波数解析の仕組みをわかりやすく解説</span></div><span class="arrow">›</span>
      </a>
      <a class="link-card" href="https://ddisk.github.io/creep/" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">⚙️</div><div class="link-text"><span class="link-name">クリープ</span><span class="link-note">クリープや回転体に関する仕組みをわかりやすく解説</span></div><span class="arrow">›</span>
      </a>
      <a class="link-card" href="https://ddisk.github.io/key/" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">🔑</div><div class="link-text"><span class="link-name">キー</span><span class="link-note">キーの選定や強度計算に関する解説ページ</span></div><span class="arrow">›</span>
      </a>
      <a class="link-card" href="https://ddisk.github.io/screw/" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">🔩</div><div class="link-text"><span class="link-name">ねじ・ボルト</span><span class="link-note">ねじやボルトの強度計算に関する解説ページ</span></div><span class="arrow">›</span>
      </a>
      <a class="link-card" href="https://ddisk.github.io/DRBFM/" target="_blank" rel="noopener noreferrer">
        <div class="link-icon">🧩</div><div class="link-text"><span class="link-name">DRBFM</span><span class="link-note">DRBFMに関する解説ページ</span></div><span class="arrow">›</span>
      </a>
    </section>

    <footer>© Link Page</footer>
  </main>
</body>
</html>
